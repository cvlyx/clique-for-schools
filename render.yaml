# Render blueprint for the Clique for Schools API (FastAPI backend).
#
# Recommended production topology: Render hosts the API here and Vercel hosts
# the frontend (see ../vercel.json), with the frontend's VITE_API_URL pointed
# at this service. In local/single-VM deployments the backend can also serve
# the built frontend itself (frontend/dist) so everything lives on one origin.
# For a true single Render service, use a Dockerfile that installs Node + pnpm
# and runs `pnpm build` before `uvicorn`.
services:
  - type: web
    name: clique-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c "cd backend && uvicorn app:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///clique.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_MINUTES
        value: "720"
      - key: PLATFORM_ADMIN_USERNAME
        value: clique-admin
      - key: PLATFORM_ADMIN_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://<your-vercel-app>.vercel.app
